name: Auto Fetch IT News Daily

on:
  schedule:
    # รันอัตโนมัติทุกวันเวลา 06:00 น. เวลาไทย (ตรงกับ 23:00 น. UTC ของวันก่อนหน้า)
    - cron: '0 23 * * *'
  workflow_dispatch: # เปิดปุ่มให้เราสามารถกดสั่งรันเองเพื่อทดสอบได้ทันที

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run fetch script
      run: node fetch_news.js

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 อัปเดตข่าวไอทีประจำวัน [Automated]" && git push)
