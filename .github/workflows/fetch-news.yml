name: Auto Fetch IT News Daily

on:
  schedule:
    # รันอัตโนมัติทุกวันเวลา 06:00 น. เวลาไทย (ตรงกับ 23:00 น. UTC ของวันก่อนหน้า)
    - cron: '0 23 * * *'
  workflow_dispatch: # เปิดปุ่มให้เราสามารถกดสั่งรันเองเพื่อทดสอบได้ทันที

# 🔑 เพิ่มสิทธิ์ตรงนี้เพื่อให้บอทสามารถ Push ไฟล์ data.json กลับเข้าคลังได้
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run fetch script
      run: node fetch_news.js

    - name: Commit and Push changes
      run: |
        # ปรับโปรไฟล์บอทให้เป็นตัวระบบของ GitHub อย่างเป็นทางการ
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data.json
        
        # ใส่ [skip ci] ไว้ท้าย Commit เพื่อไม่ให้บอทรันวนลูปซ้ำซ้อนเวลาดันไฟล์ขึ้นมาเอง
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 อัปเดตข่าวไอทีประจำวัน [Automated] [skip ci]" && git push)
