<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Knowledge Hub</title>
    <!-- เรียกใช้ Tailwind CSS + Fuse.js ค้นหา + Marked.js ตัวแปลง Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.basic.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- 🎨 จัดสไตล์เนื้อหาคู่มือด้านใน และป้องกันข้อความ/ลิงก์/ตาราง ล้นกล่อง Modal -->
    <style>
        #modalBody {
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        #modalBody h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #0f172a; line-height: 1.4; }
        #modalBody h2 { font-size: 1.25rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #1e293b; line-height: 1.4; }
        #modalBody p { margin-bottom: 0.75rem; color: #334155; line-height: 1.6; }
        
        #modalBody a { 
            color: #2563eb; 
            text-decoration: underline; 
            font-weight: 500; 
            word-break: break-all; 
            transition: color 0.2s; 
        }
        #modalBody a:hover { color: #1d4ed8; }

        #modalBody img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        #modalBody table {
            display: block;
            width: 100%;
            overflow-x: auto;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        #modalBody th, #modalBody td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
        }

        #modalBody ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        #modalBody ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        #modalBody li { margin-bottom: 0.25rem; }
        #modalBody code { background-color: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875rem; color: #0f172a; word-break: break-all; }
        #modalBody pre { background-color: #f1f5f9; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 0.75rem; max-width: 100%; }
        #modalBody pre code { background-color: transparent; padding: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-gradient-to-r from-slate-800 to-blue-900 text-white py-12 px-4 shadow-md text-center">
        <div class="max-w-5xl mx-auto">
            <span class="bg-blue-500/30 text-blue-200 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">IT Knowledge & News Hub</span>
            <h1 class="text-3xl md:text-4xl font-bold mt-3">ศูนย์รวมความรู้และข่าวสาร IT สป.พม.</h1>
            <p class="text-slate-300 mt-2 text-sm md:text-base">แพลตฟอร์มอัปเดตเทรนด์เทคโนโลยี เกาะติดทุกกระแสเทคโนโลยี นวัตกรรม และข่าวสารไอทีที่ส่งผลต่อการทำงานยุคใหม่</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- กล่องค้นหา -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-8 -mt-16 relative z-10">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="พิมพ์คำค้นหา เช่น รหัสผ่าน, Docker, AI..." 
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl py-3.5 pl-5 pr-12 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 text-lg transition shadow-inner">
                <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">🔍</div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Sidebar ตัวเลือกหมวดหมู่ -->
            <div class="md:col-span-1">
                <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200 sticky top-4">
                    <h3 class="font-bold text-slate-900 mb-3 px-2 text-sm uppercase tracking-wider text-slate-400">หมวดหมู่ความรู้</h3>
                    <nav class="space-y-1" id="categoryMenu">
                        <button onclick="switchCategory('ALL')" id="tab-ALL" class="w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer bg-blue-600 text-white shadow-xs">
                            🌐 ทั้งหมด
                        </button>
                        <button onclick="switchCategory('Internal')" id="tab-Internal" class="w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer text-slate-600 hover:bg-slate-100">
                            📋 คู่มือภายในหน่วยงาน
                        </button>
                        <button onclick="switchCategory('General')" id="tab-General" class="w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer text-slate-600 hover:bg-slate-100">
                            📰 ข่าวสารไอทีทั่วไป
                        </button>
                        <button onclick="switchCategory('Security')" id="tab-Security" class="w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer text-slate-600 hover:bg-slate-100">
                            🛡️ Cyber Security
                        </button>
                        <button onclick="switchCategory('Law')" id="tab-Law" class="w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer text-slate-600 hover:bg-slate-100">
                            ⚖️ กฎหมาย & ระเบียบ
                        </button>
                        <button onclick="switchCategory('Info')" id="tab-Info" class="w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer text-slate-600 hover:bg-slate-100">
                            💡 สรุปความรู้ (Info)
                        </button>
                    </nav>
                </div>
            </div>

            <!-- รายการแสดงผลการค้นหา -->
            <div class="md:col-span-3">
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        ผลการค้นหา <span id="resultCount" class="text-xs bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-full">กำลังโหลด...</span>
                    </h2>
                </div>
                
                <div id="newsContainer" class="space-y-4">
                    <div class="text-center py-12 text-slate-400">⏳ กำลังโหลดคลังความรู้...</div>
                </div>
            </div>
        </div>

    </main>

    <!-- โครงสร้างหน้าต่างป๊อปอัป (Modal) -->
    <div id="articleModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50 transition-all duration-200">
        <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-100 overflow-hidden transform scale-100 transition-transform">
            <!-- ส่วนหัว Modal -->
            <div class="p-6 border-b border-slate-100 flex justify-between items-start bg-slate-50/70">
                <div class="pr-4">
                    <span id="modalCategory" class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-md mb-2 inline-block"></span>
                    <h2 id="modalTitle" class="text-xl md:text-2xl font-bold text-slate-900 leading-snug break-words"></h2>
                    <p id="modalMeta" class="text-xs text-slate-400 mt-1.5"></p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 p-2.5 rounded-xl transition cursor-pointer text-2xl font-bold leading-none select-none shrink-0">&times;</button>
            </div>
            <!-- ส่วนเนื้อหาตัวเต็ม -->
            <div id="modalBody" class="p-6 overflow-y-auto flex-1 text-slate-700 leading-relaxed text-base">
                <!-- ข้อมูลจะถูกหย่อนลงตรงนี้ผ่าน JS -->
            </div>
            <!-- ส่วนท้าย Modal -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium rounded-xl transition cursor-pointer">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentFilteredData = [];
        let currentCategory = 'ALL';

        function extractFirstImageUrl(htmlString) {
            if (!htmlString) return null;
            const div = document.createElement('div');
            div.innerHTML = htmlString;
            const img = div.querySelector('img');
            return img ? img.src : null;
        }

        async function loadData() {
            try {
                const response = await fetch('data.json');
                allData = await response.json();
                filterAndDisplay();
            } catch (error) {
                console.error(error);
                document.getElementById('newsContainer').innerHTML = `<div class="text-center text-red-500 py-8">❌ ไม่สามารถโหลดคลังข้อมูลความรู้ได้</div>`;
            }
        }

        // 🔍 ฟังก์ชันกรองข้อมูลแบบใหม่ ยืดหยุ่น ค้นหาหมวดหมู่ได้แม้อยู่ในรูปแบบคำต่างกัน
        function filterAndDisplay() {
            const searchQuery = document.getElementById('searchInput').value.trim();
            
            if (currentCategory === 'ALL') {
                currentFilteredData = allData;
            } else {
                currentFilteredData = allData.filter(item => {
                    if (!item.category) return false;
                    
                    const itemCat = item.category.toString().trim().toLowerCase();
                    const selectedCat = currentCategory.trim().toLowerCase();

                    // 🛡️ สำหรับหมวดหมู่ Cyber Security (รองรับ Security, Cyber, ไซเบอร์)
                    if (selectedCat === 'security') {
                        return itemCat.includes('security') || itemCat.includes('cyber') || itemCat.includes('ไซเบอร์');
                    }

                    // 📋 รองรับหมวดหมู่อื่นๆ ยืดหยุ่นทั้งภาษาไทยและอังกฤษ
                    if (selectedCat === 'internal') return itemCat.includes('internal') || itemCat.includes('ภายใน');
                    if (selectedCat === 'general') return itemCat.includes('general') || itemCat.includes('ทั่วไป');
                    if (selectedCat === 'law') return itemCat.includes('law') || itemCat.includes('กฎหมาย');
                    if (selectedCat === 'info') return itemCat.includes('info') || itemCat.includes('สรุป');

                    return itemCat === selectedCat || itemCat.includes(selectedCat);
                });
            }

            if (searchQuery) {
                const options = { keys: ['title', 'content', 'source', 'category'], threshold: 0.4 };
                const localFuse = new Fuse(currentFilteredData, options);
                const results = localFuse.search(searchQuery);
                displayNews(results.map(r => r.item));
            } else {
                displayNews(currentFilteredData);
            }
        }

        function displayNews(articles) {
            const container = document.getElementById('newsContainer');
            document.getElementById('resultCount').innerText = `${articles.length} รายการ`;

            if (articles.length === 0) {
                container.innerHTML = `<div class="bg-white p-12 rounded-2xl text-center border border-slate-200/80 text-slate-400">🔍 ไม่พบข้อมูลในหมวดหมู่นี้ ลองค้นหาคำอื่นดูนะครับ</div>`;
                return;
            }

            container.innerHTML = articles.map(item => {
                const dateStr = item.pubDate ? new Date(item.pubDate).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
                
                let imageUrl = item.thumbnail;
                if (!imageUrl) {
                    imageUrl = extractFirstImageUrl(item.content);
                }
                
                if (!imageUrl) {
                    const fallbackImages = [
                        "https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&auto=format&fit=crop&q=60",
                        "https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?w=500&auto=format&fit=crop&q=60",
                        "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500&auto=format&fit=crop&q=60",
                        "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500&auto=format&fit=crop&q=60",
                        "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=500&auto=format&fit=crop&q=60",
                        "https://images.unsplash.com/photo-1531297484001-80022131f5a1?w=500&auto=format&fit=crop&q=60"
                    ];
                    const index = (item.title ? item.title.length : 0) % fallbackImages.length;
                    imageUrl = fallbackImages[index];
                }

                const isInternal = item.id && String(item.id).startsWith('local-');
                
                const titleLinkHtml = isInternal
                    ? `<a href="javascript:void(0)" onclick="openArticle('${item.id}')" class="hover:underline flex items-baseline gap-2 group-hover:text-blue-600">
                        <span>${item.title}</span>
                        <span class="text-[11px] font-normal text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200/60 shrink-0">อ่านในเว็บ</span>
                       </a>`
                    : `<a href="${item.link}" target="_blank" class="hover:underline flex items-baseline gap-1 group-hover:text-blue-600">
                        <span>${item.title}</span>
                        <span class="text-slate-400 text-xs font-normal shrink-0">↗</span>
                       </a>`;

                return `
                    <article class="group bg-white p-5 rounded-2xl border border-slate-200/70 hover:border-blue-400 hover:shadow-md transition duration-200 flex flex-col sm:flex-row gap-5">
                        
                        <div class="sm:w-40 sm:h-28 w-full h-40 flex-shrink-0 bg-slate-100 rounded-xl overflow-hidden border border-slate-100">
                            <img src="${imageUrl}" class="w-full h-full object-cover" alt="thumbnail" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500&auto=format&fit=crop&q=60'">
                        </div>

                        <div class="flex flex-col justify-between flex-1 min-w-0">
                            <div>
                                <div class="flex items-center gap-2 mb-1.5 text-xs">
                                    <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-medium">📍 ${item.source}</span>
                                    <span class="text-slate-400">${dateStr}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-900 mb-1 leading-snug break-words">
                                    ${titleLinkHtml}
                                </h3>
                                <p class="text-slate-600 text-sm leading-relaxed line-clamp-2 break-words">${item.content.replace(/<[^>]*>/g, '').trim()}</p>
                            </div>
                        </div>

                    </article>
                `;
            }).join('');
        }

        function openArticle(articleId) {
            const article = allData.find(item => item.id === articleId);
            if (article) {
                const dateStr = article.pubDate ? new Date(article.pubDate).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
                
                document.getElementById('modalCategory').innerText = `หมวดหมู่: ${article.category}`;
                document.getElementById('modalTitle').innerText = article.title;
                document.getElementById('modalMeta').innerText = `📍 แหล่งที่มา: ${article.source} | อัปเดตเมื่อ: ${dateStr}`;
                
                document.getElementById('modalBody').innerHTML = marked.parse(article.content);
                
                const innerLinks = document.querySelectorAll('#modalBody a');
                innerLinks.forEach(link => {
                    link.setAttribute('target', '_blank');
                    link.setAttribute('rel', 'noopener noreferrer');
                });
                
                const modal = document.getElementById('articleModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            const modal = document.getElementById('articleModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('articleModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function switchCategory(cat) {
            currentCategory = cat;
            const buttons = document.querySelectorAll('#categoryMenu button');
            buttons.forEach(btn => btn.className = "w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer text-slate-600 hover:bg-slate-100");
            const activeBtn = document.getElementById(`tab-${cat}`);
            if (activeBtn) activeBtn.className = "w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer bg-blue-600 text-white shadow-xs";
            filterAndDisplay();
        }

        document.getElementById('searchInput').addEventListener('input', filterAndDisplay);
        window.onload = loadData;
    </script>
</body>
</html>
